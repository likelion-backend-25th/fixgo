info:
  name: AI 동작 테스트
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/ai/chat"
  headers:
    - name: Accept
      value: text/event-stream
      disabled: true
  body:
    type: json
    data: |-
      {
        "text":"A/S 지원되는 모델 정보 좀 불러와줘"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
