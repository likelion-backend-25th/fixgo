info:
  name: 고객 등록 엑셀 검증
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseUrl}}/customers/bulk/validate"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - samples\customer_template_filled.xlsx
        contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
