spring:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: create   # create/update/validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
logging:
  level:
    org.springframework.security: INFO
